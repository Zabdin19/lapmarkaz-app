<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Laptop being serviced on a repair bench">
  <defs>
    <linearGradient id="atBench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF2F8"/><stop offset="1" stop-color="#D3DDE9"/>
    </linearGradient>
    <radialGradient id="atLamp" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#atBench)"/>
  <rect width="640" height="480" fill="url(#atLamp)"/>

  <!-- anti-static mat -->
  <rect x="52" y="96" width="536" height="300" rx="16" fill="#2F3E52" opacity=".12"/>

  <!-- opened laptop, seen from above -->
  <g transform="translate(150 118)">
    <!-- screen half -->
    <rect x="0" y="0" width="340" height="118" rx="8" fill="#39445A"/>
    <rect x="12" y="10" width="316" height="98" rx="5" fill="#1B2331"/>
    <rect x="34" y="34" width="120" height="8" rx="4" fill="#6E88AC" opacity=".7"/>
    <rect x="34" y="54" width="200" height="6" rx="3" fill="#54688A" opacity=".55"/>
    <rect x="34" y="70" width="160" height="6" rx="3" fill="#54688A" opacity=".35"/>

    <!-- keyboard half, back panel removed -->
    <rect x="0" y="124" width="340" height="150" rx="8" fill="#2B3444"/>
    <rect x="14" y="136" width="312" height="126" rx="6" fill="#1E2634"/>

    <!-- internals -->
    <rect x="30" y="150" width="120" height="58" rx="4" fill="#3D4A5E"/>
    <rect x="40" y="160" width="100" height="8" rx="4" fill="#5A6C86" opacity=".8"/>
    <rect x="40" y="176" width="76" height="6" rx="3" fill="#5A6C86" opacity=".5"/>
    <circle cx="212" cy="180" r="30" fill="#3D4A5E"/>
    <circle cx="212" cy="180" r="13" fill="#566B85"/>
    <g stroke="#566B85" stroke-width="5" stroke-linecap="round">
      <path d="M212 152v12M212 196v12M190 180h-12M234 180h12"/>
    </g>
    <rect x="256" y="150" width="56" height="100" rx="5" fill="#3D4A5E"/>
    <rect x="266" y="162" width="36" height="7" rx="3.5" fill="#5A6C86" opacity=".7"/>
    <rect x="266" y="176" width="36" height="7" rx="3.5" fill="#5A6C86" opacity=".5"/>
    <rect x="30" y="222" width="120" height="28" rx="4" fill="#3D4A5E"/>
  </g>

  <!-- screwdriver -->
  <g transform="rotate(-24 118 380)">
    <rect x="42" y="368" width="132" height="20" rx="10" fill="#4A5568"/>
    <rect x="174" y="374" width="76" height="8" rx="4" fill="#AEB9C7"/>
    <rect x="250" y="375" width="16" height="6" rx="2" fill="#8B97A8"/>
  </g>

  <!-- loose screws -->
  <g fill="#8B97A8">
    <circle cx="536" cy="150" r="7"/><circle cx="562" cy="176" r="7"/><circle cx="524" cy="196" r="7"/>
  </g>

  <!-- gloved hand steadying the chassis -->
  <g transform="translate(468 300)">
    <path d="M0 96c-8-34 6-62 34-74 12-5 26-4 38 3l40 24c10 6 13 19 7 29s-19 13-29 7l-18-11 30 44c7 10 4 24-6 31s-24 4-31-6z"
      fill="#8FCDEC"/>
    <path d="M12 60c14-14 34-18 52-11" fill="none" stroke="#6FB6DA" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brush + tray -->
  <rect x="60" y="196" width="16" height="96" rx="8" fill="#9AA7B8"/>
  <rect x="56" y="176" width="24" height="26" rx="6" fill="#C3CDDA"/>
</svg>

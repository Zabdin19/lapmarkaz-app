<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Laptop showing the Lapmarkaz signup form">
  <defs>
    <linearGradient id="suBg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#2C3B52"/>
      <stop offset=".5" stop-color="#3B4E6B"/>
      <stop offset="1" stop-color="#222E42"/>
    </linearGradient>
    <radialGradient id="suGlow" cx=".5" cy=".3" r=".55">
      <stop offset="0" stop-color="#CFE0FA" stop-opacity=".22"/>
      <stop offset="1" stop-color="#CFE0FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suLid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D5DCE6"/>
      <stop offset="1" stop-color="#AEB8C6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#suBg)"/>
  <rect width="800" height="1000" fill="url(#suGlow)"/>

  <!-- desk -->
  <path d="M0 700h800v300H0z" fill="#1E2941" opacity=".55"/>
  <path d="M0 700h800v6H0z" fill="#9DB0C8" opacity=".2"/>

  <!-- laptop -->
  <g transform="translate(170 300)">
    <rect x="0" y="0" width="460" height="300" rx="14" fill="url(#suLid)"/>
    <rect x="14" y="14" width="432" height="272" rx="7" fill="#F7F9FC"/>

    <!-- mock signup form on screen -->
    <rect x="44" y="42" width="150" height="13" rx="6.5" fill="#0F172A" opacity=".8"/>
    <rect x="44" y="78" width="120" height="8" rx="4" fill="#94A3B8"/>
    <rect x="44" y="94" width="372" height="30" rx="7" fill="#EDF1F6"/>
    <rect x="44" y="138" width="120" height="8" rx="4" fill="#94A3B8"/>
    <rect x="44" y="154" width="372" height="30" rx="7" fill="#EDF1F6"/>
    <rect x="44" y="198" width="120" height="8" rx="4" fill="#94A3B8"/>
    <rect x="44" y="214" width="372" height="30" rx="7" fill="#EDF1F6"/>
    <rect x="44" y="256" width="372" height="20" rx="7" fill="#0B5FD5"/>

    <!-- base -->
    <path d="M-58 300h576l62 74H-120z" fill="#C3CBD8"/>
    <path d="M-120 374h700a14 14 0 0 1-14 14H-106a14 14 0 0 1-14-14z" fill="#A3AEBE"/>
    <rect x="180" y="378" width="100" height="6" rx="3" fill="#8A96A8"/>
  </g>

  <!-- mug -->
  <g transform="translate(96 636)" fill="#7E92AB" opacity=".85">
    <rect x="0" y="14" width="52" height="48" rx="7"/>
    <path d="M52 26h11a12 12 0 0 1 0 24H52z" fill="none" stroke="#7E92AB" stroke-width="7"/>
  </g>

  <!-- notebook -->
  <rect x="614" y="654" width="132" height="22" rx="5" fill="#7E92AB" opacity=".7"/>
  <rect x="628" y="634" width="118" height="18" rx="5" fill="#93A6BE" opacity=".55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="930 0 520 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Student desk setup">
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243244"/>
      <stop offset=".55" stop-color="#33445B"/>
      <stop offset="1" stop-color="#4A5F79"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1420" stop-opacity=".82"/>
      <stop offset=".55" stop-color="#0B1420" stop-opacity=".42"/>
      <stop offset="1" stop-color="#0B1420" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".72" cy=".18" r=".55">
      <stop offset="0" stop-color="#FFE8C2" stop-opacity=".33"/>
      <stop offset="1" stop-color="#FFE8C2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#deskBg)"/>
  <rect width="1600" height="520" fill="url(#lamp)"/>

  <!-- desk surface -->
  <path d="M0 388h1600v132H0z" fill="#2B3A4D" opacity=".85"/>
  <path d="M0 388h1600v10H0z" fill="#8FA3BB" opacity=".18"/>

  <!-- laptop -->
  <g transform="translate(1010 96)">
    <rect x="0" y="0" width="360" height="228" rx="10" fill="#B9C2CE" opacity=".95"/>
    <rect x="11" y="11" width="338" height="206" rx="5" fill="#101A26"/>
    <rect x="11" y="11" width="338" height="22" rx="5" fill="#1C2836"/>
    <rect x="34" y="54" width="150" height="10" rx="5" fill="#7C90A8" opacity=".7"/>
    <rect x="34" y="78" width="250" height="7" rx="3.5" fill="#5B6C82" opacity=".6"/>
    <rect x="34" y="96" width="196" height="7" rx="3.5" fill="#5B6C82" opacity=".45"/>
    <rect x="34" y="128" width="98" height="66" rx="6" fill="#26374A"/>
    <rect x="146" y="128" width="98" height="66" rx="6" fill="#26374A"/>
    <rect x="258" y="128" width="60" height="66" rx="6" fill="#26374A"/>
    <path d="M-42 228h444l48 64H-90z" fill="#C6CEDA" opacity=".95"/>
    <path d="M-90 292h540a12 12 0 0 1-12 12H-78a12 12 0 0 1-12-12z" fill="#A9B4C4"/>
  </g>

  <!-- books -->
  <g transform="translate(196 300)">
    <rect x="0" y="58" width="238" height="20" rx="4" fill="#4B6178"/>
    <rect x="10" y="36" width="222" height="20" rx="4" fill="#5C748E"/>
    <rect x="4" y="14" width="230" height="20" rx="4" fill="#3E5268"/>
  </g>

  <!-- mug -->
  <g transform="translate(520 316)" fill="#93A4B8" opacity=".9">
    <rect x="0" y="16" width="62" height="56" rx="8"/>
    <path d="M62 30h14a14 14 0 0 1 0 28H62z" fill="none" stroke="#93A4B8" stroke-width="8"/>
  </g>

  <!-- notebook + pen -->
  <g transform="translate(660 356)" opacity=".8">
    <rect x="0" y="0" width="180" height="26" rx="5" fill="#8DA0B6"/>
    <rect x="196" y="6" width="120" height="8" rx="4" fill="#B8C6D6"/>
  </g>

  <rect width="1600" height="520" fill="url(#scrim)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Laptops stacked in the Lapmarkaz store">
  <defs>
    <linearGradient id="asBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#DCE4EE"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#asBg)"/>

  <!-- back wall sign -->
  <rect x="330" y="34" width="230" height="52" rx="8" fill="#FFFFFF" opacity=".85"/>
  <rect x="360" y="54" width="140" height="12" rx="6" fill="#0F2A55" opacity=".65"/>

  <!-- shelving -->
  <g fill="#C4D0DE">
    <rect x="24" y="120" width="270" height="10" rx="4"/>
    <rect x="24" y="200" width="270" height="10" rx="4"/>
    <rect x="330" y="150" width="240" height="10" rx="4"/>
  </g>
  <g fill="#8E9FB4" opacity=".55">
    <rect x="46" y="66" width="46" height="54" rx="4"/>
    <rect x="108" y="76" width="46" height="44" rx="4"/>
    <rect x="170" y="60" width="46" height="60" rx="4"/>
    <rect x="232" y="80" width="46" height="40" rx="4"/>
    <rect x="356" y="98" width="52" height="52" rx="4"/>
    <rect x="424" y="106" width="52" height="44" rx="4"/>
    <rect x="492" y="92" width="52" height="58" rx="4"/>
  </g>

  <!-- counter -->
  <rect x="0" y="272" width="640" height="148" fill="#E7EDF4"/>
  <rect x="0" y="272" width="640" height="9" fill="#CFD9E5"/>

  <!-- stack of closed laptops -->
  <g transform="translate(150 196)">
    <rect x="0" y="60" width="330" height="17" rx="5" fill="#3A4354"/>
    <rect x="8" y="42" width="314" height="16" rx="5" fill="#4A5466"/>
    <rect x="4" y="24" width="322" height="16" rx="5" fill="#2F3846"/>
    <rect x="14" y="6" width="302" height="16" rx="5" fill="#4A5466"/>
    <g fill="#9EAABB" opacity=".55">
      <rect x="20" y="66" width="290" height="3" rx="1.5"/>
      <rect x="28" y="48" width="274" height="3" rx="1.5"/>
      <rect x="24" y="30" width="282" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- price card -->
  <rect x="70" y="300" width="120" height="66" rx="8" fill="#FFFFFF"/>
  <rect x="86" y="318" width="58" height="9" rx="4.5" fill="#0B5FD5" opacity=".7"/>
  <rect x="86" y="338" width="86" height="7" rx="3.5" fill="#A9B7C8"/>

  <!-- spotlight -->
  <ellipse cx="315" cy="292" rx="230" ry="34" fill="#FFFFFF" opacity=".45"/>
</svg>

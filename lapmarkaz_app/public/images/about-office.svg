<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="HamzaTraders workspace">
  <defs>
    <linearGradient id="aoWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8EEF7"/><stop offset="1" stop-color="#CBD8E9"/>
    </linearGradient>
    <linearGradient id="aoDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6242"/><stop offset="1" stop-color="#5F4229"/>
    </linearGradient>
    <linearGradient id="aoGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F7FF" stop-opacity=".9"/><stop offset="1" stop-color="#C3D6EE" stop-opacity=".7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" fill="url(#aoWall)"/>

  <!-- window wall -->
  <rect x="30" y="30" width="500" height="300" fill="url(#aoGlass)"/>
  <g stroke="#8FA6C4" stroke-opacity=".55" stroke-width="7">
    <path d="M200 30v300M370 30v300M30 180h500"/>
  </g>
  <g fill="#9FB4CE" opacity=".5">
    <rect x="60" y="120" width="60" height="60"/><rect x="240" y="86" width="52" height="94"/>
    <rect x="410" y="130" width="70" height="50"/>
  </g>

  <!-- brand wall panel -->
  <rect x="612" y="52" width="250" height="150" rx="8" fill="#0F2A55" opacity=".9"/>
  <rect x="640" y="104" width="120" height="14" rx="7" fill="#7FB3FF" opacity=".85"/>
  <rect x="640" y="130" width="180" height="9" rx="4.5" fill="#7FB3FF" opacity=".45"/>

  <!-- plant -->
  <g transform="translate(556 196)" opacity=".9">
    <path d="M26 120V60" stroke="#4F7A56" stroke-width="7" stroke-linecap="round"/>
    <path d="M26 74C6 66 0 46 4 26c20 4 30 24 22 48zM26 80c22-10 28-32 24-52-20 4-32 26-24 52z" fill="#4F7A56"/>
    <path d="M6 120h40l-6 40H12z" fill="#B5844F"/>
  </g>

  <!-- desk -->
  <rect x="0" y="330" width="900" height="52" fill="url(#aoDesk)"/>
  <rect x="0" y="382" width="900" height="178" fill="#B9C6D8"/>
  <rect x="0" y="330" width="900" height="7" fill="#C79A6E" opacity=".55"/>

  <!-- monitor on arm -->
  <g transform="translate(150 132)">
    <rect x="0" y="0" width="164" height="112" rx="7" fill="#1A2434"/>
    <rect x="8" y="8" width="148" height="96" rx="4" fill="#26354C"/>
    <rect x="24" y="26" width="80" height="8" rx="4" fill="#6E88AC"/>
    <rect x="24" y="46" width="112" height="6" rx="3" fill="#54688A"/>
    <rect x="24" y="62" width="92" height="6" rx="3" fill="#54688A" opacity=".7"/>
    <path d="M82 112v52" stroke="#31435D" stroke-width="9"/>
    <path d="M82 164h-96" stroke="#31435D" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- laptop, code editor -->
  <g transform="translate(300 196)">
    <rect x="0" y="0" width="210" height="130" rx="7" fill="#C8D1DE"/>
    <rect x="8" y="8" width="194" height="114" rx="4" fill="#16202F"/>
    <rect x="20" y="22" width="60" height="7" rx="3.5" fill="#5CC9A7"/>
    <rect x="20" y="38" width="120" height="6" rx="3" fill="#6E88AC" opacity=".8"/>
    <rect x="32" y="52" width="96" height="6" rx="3" fill="#E0B36A" opacity=".8"/>
    <rect x="32" y="66" width="140" height="6" rx="3" fill="#6E88AC" opacity=".6"/>
    <rect x="20" y="82" width="80" height="6" rx="3" fill="#5CC9A7" opacity=".7"/>
    <rect x="32" y="96" width="112" height="6" rx="3" fill="#6E88AC" opacity=".45"/>
    <path d="M-28 130h266l30 34H-58z" fill="#D7DEE8"/>
  </g>

  <!-- second laptop, dashboard -->
  <g transform="translate(566 216)">
    <rect x="0" y="0" width="180" height="112" rx="6" fill="#C8D1DE"/>
    <rect x="7" y="7" width="166" height="98" rx="4" fill="#F4F8FD"/>
    <rect x="20" y="20" width="70" height="8" rx="4" fill="#0B5FD5" opacity=".8"/>
    <rect x="20" y="38" width="132" height="6" rx="3" fill="#A9BBD3"/>
    <g fill="#0B5FD5" opacity=".55">
      <rect x="20" y="76" width="18" height="18"/><rect x="46" y="64" width="18" height="30"/>
      <rect x="72" y="56" width="18" height="38"/><rect x="98" y="70" width="18" height="24"/>
    </g>
    <path d="M-24 112h228l26 30H-50z" fill="#D7DEE8"/>
  </g>

  <!-- mug + mouse + notebook -->
  <g transform="translate(196 292)" fill="#F2F5F9">
    <rect x="0" y="8" width="42" height="34" rx="6"/>
    <path d="M42 16h9a9 9 0 0 1 0 18h-9z" fill="none" stroke="#F2F5F9" stroke-width="6"/>
  </g>
  <ellipse cx="796" cy="352" rx="22" ry="13" fill="#2B3446"/>
  <rect x="60" y="338" width="150" height="16" rx="4" fill="#6B4A2E"/>
</svg>

{# Single-bar dark footer: copyright left, policy links right. #}
<footer class="bg-navy text-slate-400">
	<div class="lm-shell flex flex-col gap-4 py-7 sm:flex-row sm:items-center sm:justify-between">
		<p class="max-w-[260px] text-[12.5px] leading-relaxed">
			{{ footer_note or "© 2024 Lapmarkaz. Premium Tech for Pakistan." }}
		</p>
		<nav class="flex flex-wrap items-center gap-x-7 gap-y-2">
			{%- for link in (footer_links or []) %}
			<a href="{{ link.href }}" class="text-[12.5px] transition hover:text-white">{{ link.label }}</a>
			{%- endfor %}
		</nav>
	</div>
</footer>
